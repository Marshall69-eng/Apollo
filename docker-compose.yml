services:
  app:
    build: .
    env_file: .env
    environment:
      DB_PATH: /data/storm_baler.db
      RIVER_GEOJSON: /geo/calumpang_rivers.geojson
    volumes:
      - nzw-data:/data          # SQLite database (back this volume up)
      - ./geo:/geo:ro           # drop calumpang_rivers.geojson in ./geo
    expose: ["8000"]            # reachable only through Caddy
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
    restart: unless-stopped
volumes:
  nzw-data:
  caddy-data:
